[project]
name = "hextobinarytrainer2backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "asyncpg>=0.31.0",
    "bcrypt>=4.0.0",
    "cryptography>=50.0.2",
    "dotenv>=0.9.9",
    "fastapi[standard]>=0.135.3",
    "pydantic>=2.12.5",
    "pydantic-settings>=2.13.1",
    "pyjwt>=2.8.0",
    "ruff>=0.17.1",
    "slowapi>=0.1.9",
    "sqlalchemy>=2.0.49",
    "starlette>=1.0.0",
    "uuid-utils>=0.10.0",
    "uvicorn>=0.44.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=6.0.0",
    "aiosqlite>=0.20.0",
    "greenlet>=3.0.0",
    "httpx>=0.27.0",
]

[tool.ruff]
target-version = "py312"
src = ["src"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "UP",   # pyupgrade
]
ignore = [
    "B008", # Allow Depends() in function defaults (FastAPI pattern)
]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = [
    "-ra",
    "--strict-markers",
    "--cov=src",
    "--cov-report=term-missing",
    "--cov-fail-under=80",
]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = [
    "ignore::DeprecationWarning",
]

[tool.coverage.run]
# SQLAlchemy async switches to greenlets (and aiosqlite runs queries in a
# worker thread). Without explicit concurrency support, coverage loses the
# trace after the first await into the DB layer and understates auth router
# coverage. See US-21 part 2 investigation.
concurrency = ["greenlet", "thread"]
omit = [
    "src/init_db.py",  # Setup script, not testable
    "src/routers/game.py",  # Not part of Sprint 2
    "src/services/game_service.py",  # Not part of Sprint 2
    "src/migrations/v002_add_user_stats.py",  # Not part of Sprint 2
    "src/schemas/*",  # Not part of Sprint 2
    "src/services/email_service.py",  # SMTP sending requires external server
    "*/tests/*",
]
